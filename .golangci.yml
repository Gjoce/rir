version: "2"

run:
  timeout: 5m

linters:
  # errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - misspell
  exclusions:
    # Skip code generated by templ and ogen ("Code generated ... DO NOT EDIT").
    generated: lax
    paths:
      - vendor

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - vendor
