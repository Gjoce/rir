<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#333">
  <rect width="1200" height="800" fill="#fff"/>
  <!-- navbar -->
  <rect x="0" y="0" width="1200" height="64" fill="#e6e6e6" stroke="#999"/>
  <text x="32" y="40" font-size="22" font-weight="bold">CyberMedico</text>
  <text x="900" y="40">Zdravniki</text>
  <text x="1010" y="40">Kako deluje</text>
  <!-- title -->
  <text x="32" y="120" font-size="28" font-weight="bold">Izberite specialista</text>
  <text x="32" y="150" fill="#666">Pisna konzultacija v 72 urah ali video klic v brskalniku.</text>
  <!-- filter -->
  <rect x="32" y="175" width="320" height="44" fill="#fff" stroke="#999" rx="4"/>
  <text x="48" y="203" fill="#888">Specializacija: vse  ▾</text>
  <rect x="368" y="175" width="320" height="44" fill="#fff" stroke="#999" rx="4"/>
  <text x="384" y="203" fill="#888">Jezik: vsi  ▾</text>
  <!-- cards -->
  <g id="card">
    <rect x="32" y="250" width="360" height="500" fill="#fafafa" stroke="#999" rx="6"/>
    <rect x="52" y="270" width="320" height="180" fill="#ddd" stroke="#aaa"/>
    <line x1="52" y1="270" x2="372" y2="450" stroke="#aaa"/><line x1="372" y1="270" x2="52" y2="450" stroke="#aaa"/>
    <text x="52" y="485" font-size="20" font-weight="bold">dr. Ime Priimek</text>
    <text x="52" y="512">Kardiologija</text>
    <text x="52" y="537" fill="#666">UKC Ljubljana</text>
    <text x="52" y="562" fill="#666">Jeziki: SL, EN</text>
    <text x="52" y="600">Pisna: 40 €</text>
    <text x="232" y="600">Video: 60 €</text>
    <rect x="52" y="625" width="150" height="44" fill="#bbb" stroke="#888" rx="4"/>
    <text x="72" y="653">Pisna konz.</text>
    <rect x="222" y="625" width="150" height="44" fill="#bbb" stroke="#888" rx="4"/>
    <text x="244" y="653">Video konz.</text>
    <text x="52" y="715" fill="#666" text-decoration="underline">Več o zdravniku</text>
  </g>
  <use href="#card" x="388"/>
  <use href="#card" x="776"/>
</svg>
