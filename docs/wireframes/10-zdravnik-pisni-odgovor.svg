  <text x="394" y="337" font-size="14" font-weight="normal" fill="#999" text-anchor="start">000000</text>
  <rect x="384" y="366" width="432" height="36" fill="#888" stroke="#666" stroke-width="1" rx="4"/>
  <text x="600.0" y="389.0" font-size="15" font-weight="bold" fill="#fff" text-anchor="middle">Submit answer</text>
  <text x="180" y="630" font-size="11" font-weight="normal" fill="#fff" text-anchor="start" font-style="italic">Po kliku Submit se odpre okno za TOTP; odgovor se podpiše in pošlje pacientu šele po pravilni kodi.</text>
