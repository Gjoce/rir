openapi: "3.1.1"
servers:
  - url: http://localhost:8080
    description: URL used for local development
info:
  version: 1.0.0
  title: CyberMedico HyperMedia API
paths:
  /:
    get:
      operationId: root
      parameters:
        - name: Datastar-Request
          in: header
          schema:
            type: boolean
      responses:
        "200":
          $ref: "#/components/responses/200"
        "default":
          $ref: "#/components/responses/default"
  /specialists/{id}:
    get:
      operationId: specialist
      parameters:
        - $ref: "#/components/parameters/UUID"
      responses:
        "200":
          $ref: "#/components/responses/200"
        "default":
          $ref: "#/components/responses/default"
  /specialists/{id}/written:
    get:
      operationId: written_order_form
      parameters:
        - $ref: "#/components/parameters/UUID"
      responses:
        "200":
          $ref: "#/components/responses/200"
        "default":
          $ref: "#/components/responses/default"
    post:
      operationId: written_order_submit
      parameters:
        - $ref: "#/components/parameters/UUID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ConsultationOrderForm"
      responses:
        "200":
          $ref: "#/components/responses/200"
        "303":
          $ref: "#/components/responses/303"
        "default":
          $ref: "#/components/responses/default"
  /specialists/{id}/video:
    get:
      operationId: video_order_form
      parameters:
        - $ref: "#/components/parameters/UUID"
      responses:
        "200":
          $ref: "#/components/responses/200"
        "default":
          $ref: "#/components/responses/default"
    post:
      operationId: video_order_submit
      parameters:
        - $ref: "#/components/parameters/UUID"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ConsultationOrderForm"
      responses:
        "200":
          $ref: "#/components/responses/200"
        "303":
          $ref: "#/components/responses/303"
        "default":
          $ref: "#/components/responses/default"
  /order-submitted:
    get:
      operationId: order_submitted
      responses:
        "200":
          $ref: "#/components/responses/200"
        "default":
          $ref: "#/components/responses/default"
  /themes/{theme}:
    get:
      operationId: themes
      parameters:
        - name: theme
          in: path
          required: true
          schema:
            type: string
      responses:
        "303":
          $ref: "#/components/responses/303"
        "default":
          $ref: "#/components/responses/default"
  /auth/login:
    get:
      operationId: login
      responses:
        "200":
          $ref: "#/components/responses/200"
        "default":
          $ref: "#/components/responses/default"
    post:
      operationId: loginSubmit
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
      responses:
        "200":
          $ref: "#/components/responses/200"
        "303":
          $ref: "#/components/responses/303"
        "default":
          $ref: "#/components/responses/default"
  /auth/2fa:
    get:
      operationId: twoFactorForm
      responses:
        "200":
          $ref: "#/components/responses/200"
        "303":
          $ref: "#/components/responses/303"
        "default":
          $ref: "#/components/responses/default"
    post:
      operationId: twoFactorSubmit
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                totp_code:
                  type: string
              required:
                - totp_code
      responses:
        "303":
          $ref: "#/components/responses/303"
        "200":
          $ref: "#/components/responses/200"
        "default":
          $ref: "#/components/responses/default"
  /auth/2fa/setup:
    get:
      operationId: twoFactorSetupForm
      responses:
        "200":
          $ref: "#/components/responses/200"
        "303":
          $ref: "#/components/responses/303"
        "default":
          $ref: "#/components/responses/default"
    post:
      operationId: twoFactorSetupSubmit
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                totp_code:
                  type: string
              required:
                - totp_code
      responses:
        "303":
          $ref: "#/components/responses/303"
        "200":
          $ref: "#/components/responses/200"
        "default":
          $ref: "#/components/responses/default"
  /logout:
    get:
      security:
        - sessionCookie: []
      operationId: logout
      responses:
        "303":
          $ref: "#/components/responses/303"
        "default":
          $ref: "#/components/responses/default"
  /consultations:
    get:
      security:
        - sessionCookie: []
      operationId: consultations_form
      parameters:
        - name: Datastar-Request
          in: header
          schema:
            type: boolean
      responses:
        "200":
          $ref: "#/components/responses/200"
        "default":
          $ref: "#/components/responses/default"
  /consultations/{id}:
    get:
      security:
        - sessionCookie: []
      operationId: consultation_form
      parameters:
        - $ref: "#/components/parameters/UUID"
      responses:
        "200":
          $ref: "#/components/responses/200"
        "default":
          $ref: "#/components/responses/default"
  /consultations/{id}/answer:
    get:
      security:
        - sessionCookie: []
      operationId: consultation_answer_form
      parameters:
        - $ref: "#/components/parameters/UUID"
      responses:
        "200":
          $ref: "#/components/responses/200"
        "default":
          $ref: "#/components/responses/default"
    post:
      security:
        - sessionCookie: []
      operationId: consultation_answer_submit
      parameters:
        - $ref: "#/components/parameters/UUID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                answer:
                  type: string
                totp_code:
                  type: string
              required:
                - answer
                - totp_code
      responses:
        "200":
          $ref: "#/components/responses/200"
        "default":
          $ref: "#/components/responses/default"
  /dashboard:
    get:
      security:
        - sessionCookie: []
      operationId: dashboard
      responses:
        "200":
          $ref: "#/components/responses/200"
        "default":
          $ref: "#/components/responses/default"
components:
  schemas:
    # Nothing is required here on purpose: the handler validates the fields, so a
    # missing one shows a message on the form instead of an error page.
    ConsultationOrderForm:
      type: object
      properties:
        patient_name:
          type: string
        patient_surname:
          type: string
        patient_age:
          type: string
        patient_email:
          type: string
        patient_phone:
          type: string
        medical_problem:
          type: string
        patient_diagnosis:
          type: string
        medication:
          type: string
        allergies:
          type: string
        need_translator:
          type: boolean
        terms_accepted:
          type: boolean
        preferred_time:
          type: string
          description: Only used for video consultations
        urgent:
          type: boolean
          description: Only used for video consultations
        attachments:
          type: array
          items:
            type: string
            format: binary
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cybermedico_session
  parameters:
    UUID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    "200":
      description: OK
      content:
        text/html:
          schema:
            type: string
    "303":
      description: See Other
      headers:
        Location:
          schema:
            type: string
        Set-Cookie:
          schema:
            type: string
    default:
      description: Unexpected error
      content:
        text/html:
          schema:
            type: string
