openapi: "3.1.1"
servers:
  - url: http://localhost:8080
    description: URL used for local development
info:
  version: 1.0.0
  title: CyberMedico HyperMedia API
paths:
  /:
    get:
      operationId: root
      responses:
        "200":
          $ref: "#/components/responses/200"
        "default":
          $ref: "#/components/responses/default"
  /themes/{theme}:
    get:
      operationId: themes
      parameters:
        - name: theme
          in: path
          required: true
          schema:
            type: string
      responses:
        "303":
          $ref: "#/components/responses/303"
        "default":
          $ref: "#/components/responses/default"
  /auth/login:
    get:
      operationId: login
      responses:
        "200":
          $ref: "#/components/responses/200"
        "default":
          $ref: "#/components/responses/default"
    post:
      operationId: loginSubmit
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
                - email
                - password
      responses:
        "200":
          $ref: "#/components/responses/200"
        "303":
          $ref: "#/components/responses/303"
        "default":
          $ref: "#/components/responses/default"
  /auth/2fa:
    get:
      operationId: twoFactorForm
      responses:
        "200":
          $ref: "#/components/responses/200"
        "303":
          $ref: "#/components/responses/303"
        "default":
          $ref: "#/components/responses/default"
    post:
      operationId: twoFactorSubmit
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                totp_code:
                  type: string
              required:
                - totp_code
      responses:
        "303":
          $ref: "#/components/responses/303"
        "200":
          $ref: "#/components/responses/200"
        "default":
          $ref: "#/components/responses/default"
  /auth/2fa/setup:
    get:
      operationId: twoFactorSetupForm
      responses:
        "200":
          $ref: "#/components/responses/200"
        "303":
          $ref: "#/components/responses/303"
        "default":
          $ref: "#/components/responses/default"
    post:
      operationId: twoFactorSetupSubmit
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                totp_code:
                  type: string
              required:
                - totp_code
      responses:
        "303":
          $ref: "#/components/responses/303"
        "200":
          $ref: "#/components/responses/200"
        "default":
          $ref: "#/components/responses/default"
  /logout:
    get:
      security:
        - sessionCookie: []
      operationId: logout
      responses:
        "303":
          $ref: "#/components/responses/303"
        "default":
          $ref: "#/components/responses/default"
  /dashboard:
    get:
      security:
        - sessionCookie: []
      operationId: dashboard
      responses:
        "200":
          $ref: "#/components/responses/200"
        "default":
          $ref: "#/components/responses/default"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cybermedico_session
  responses:
    "200":
      description: OK
      content:
        text/html:
          schema:
            type: string
    "303":
      description: See Other
      headers:
        Location:
          schema:
            type: string
        Set-Cookie:
          schema:
            type: string
    default:
      description: Unexpected error
      content:
        text/html:
          schema:
            type: string
