services:
  db:
    image: postgres:18
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    env_file:
      - ./resources/config/mailpit/compose.env
    ports:
      - "8025:8025"
      - "${SMTP_PORT}:1025"
    volumes:
      - mailpit_data:/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # MinIO starts without buckets and the API refuses to start if they are missing.
  # It exits when done, which `up --wait` treats as a failure, so the profile keeps
  # it out of `up` and the docker:up task runs it separately.
  minio-init:
    image: minio/mc
    profiles: [init]
    depends_on:
      - minio
    entrypoint: >
      sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY}; do sleep 1; done;
      mc mb --ignore-existing local/${S3_BUCKET} local/${S3_SIGNATURES_BUCKET}
      "

volumes:
  db_data:
  mailpit_data:
  minio_data:
