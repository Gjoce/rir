services:
  db:
    image: postgres:18
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    env_file:
      - ./resources/config/mailpit/compose.env
    ports:
      - "8025:8025"
      - "${SMTP_PORT}:1025"
    volumes:
      - mailpit_data:/data

  minio:
    image: pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    entrypoint: >
      sh -c "
      mkdir -p /data/${S3_BUCKET} /data/${S3_SIGNATURES_BUCKET} &&
      exec docker-entrypoint.sh server /data --console-address :9001
      "
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # TURN relay for video calls. Local only: it announces 127.0.0.1, so it relays
  # between browsers on this machine, which is enough to test the credentials.
  coturn:
    image: coturn/coturn:4.7.0
    command:
      - -n
      - --log-file=stdout
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET}
      - --realm=cybermedico.local
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --external-ip=127.0.0.1
      - --allow-loopback-peers
      - --fingerprint
      - --no-tls
      - --no-dtls
      - --no-cli
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"

volumes:
  db_data:
  mailpit_data:
  minio_data:
